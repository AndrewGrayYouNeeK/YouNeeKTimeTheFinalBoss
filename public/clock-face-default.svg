<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1a2a1a"/>
      <stop offset="50%" stop-color="#0a0f14"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="lavaGlow" cx="50%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#ff3300" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="volcanoBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="60%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="lava" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="50%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#ff2200"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Night sky -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <rect width="400" height="400" fill="url(#lavaGlow)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="50" cy="45" r="1.2"/>
    <circle cx="120" cy="30" r="0.8"/>
    <circle cx="280" cy="55" r="1"/>
    <circle cx="350" cy="40" r="0.9"/>
    <circle cx="80" cy="90" r="0.7"/>
    <circle cx="320" cy="80" r="1.1"/>
    <circle cx="200" cy="25" r="0.8"/>
    <circle cx="160" cy="70" r="0.6"/>
    <circle cx="240" cy="60" r="0.9"/>
  </g>

  <!-- Volcano mountain -->
  <path d="M 60 380 L 140 160 L 200 120 L 260 160 L 340 380 Z" fill="url(#volcanoBody)"/>
  <path d="M 140 160 L 200 120 L 260 160 L 240 200 L 160 200 Z" fill="#111111"/>

  <!-- Crater lava -->
  <ellipse cx="200" cy="175" rx="45" ry="12" fill="url(#lava)" filter="url(#glow)"/>
  <ellipse cx="200" cy="172" rx="30" ry="7" fill="#ffcc00" opacity="0.9"/>

  <!-- Lava streams -->
  <path d="M 195 185 Q 190 250 175 340" stroke="url(#lava)" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 205 185 Q 215 260 225 350" stroke="url(#lava)" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- YouNeek text on volcano -->
  <text
    x="200" y="290"
    text-anchor="middle"
    font-family="monospace"
    font-weight="bold"
    font-size="28"
    fill="#39ff14"
    filter="url(#glow)"
    opacity="0.95"
  >YouNeek</text>
  <text
    x="200" y="318"
    text-anchor="middle"
    font-family="monospace"
    font-weight="bold"
    font-size="11"
    fill="#39ff14"
    opacity="0.6"
    letter-spacing="6"
  >TIME</text>
</svg>
